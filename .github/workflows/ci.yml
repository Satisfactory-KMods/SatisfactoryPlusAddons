name: Satisfactory Plus Addons validation

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check KDF-only packaging
        shell: bash
        run: |
          if [ -d Source ] || find Content -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "::error::Content assets or C++ found. This mod is packaged as a KDF source mod; switch the Modding build to full plugin packaging first."
            exit 1
          fi
      - name: Checkout canonical KDataForge validator
        uses: actions/checkout@v7
        with:
          repository: Satisfactory-KMods/kdataforge-tools
          ref: feat/kdataforge-authoring-qol
          path: .ci/kdataforge-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/kdataforge-tools
      - name: Build kdf CLI
        run: cargo build --manifest-path .ci/kdataforge-tools/Cargo.toml --locked --release --bin kdf
      - name: Lint DataForge packs
        shell: bash
        run: |
          if find DataForge -name pack.yml -type f -print -quit | grep -q .; then
            .ci/kdataforge-tools/target/release/kdf lint DataForge --format github
          else
            echo "No module packs yet; lint skipped."
          fi

  # dev is the default branch and only validates. Release builds will run from the protected main
  # branch; that flow is intentionally absent until the owner enables a manual one.
