  source: Repeatable Delivery contracts from Tier 6 can also ask for fluids, from 1,000 m³ in Tier 6 up to 10,000 m³ in Tier 10. Each tier adds two fluids to two of its contracts. Fluids only come up once you own the Delivery Adapter and FaxIT fluid transport. Turned off, these contracts ask for items only.
